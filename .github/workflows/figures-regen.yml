name: Contract figures regen

# Uprava H5423 (E016 wave 5) — live trigger for the two committed cross-repo
# contract assets. Before this, both were regenerated by hand and CI only
# validated what was committed (validate-lemma-summary.yml, dcs-validate.yml).
#
#   dcs_published_figures.json  <- src/DCS-data-2026/regen_widgets.py --figures-only (timws.csv)
#   dcs_lemma_summary.json      <- gen_dcs_lemma_summary.py (src/DCS-data-2021/_8.csv)
#
#   pull_request            regenerate + refuse a real drift
#   push to main / dispatch regenerate + commit the result back to main
#
# check_generated_figures.py compares parsed JSON without the "generatedAt" run
# date, so a same-content rerun never commits date churn. main has no required
# checks or reviews; a GITHUB_TOKEN push does not re-trigger workflows.

on:
  pull_request:
    paths:
      - "src/DCS-data-2021/timws.csv"
      - "src/DCS-data-2021/_8.csv"
      - "src/DCS-data-2026/regen_widgets.py"
      - "gen_dcs_lemma_summary.py"
      - "dcs_published_figures.json"
      - "dcs_lemma_summary.json"
      - "check_generated_figures.py"
      - ".github/workflows/figures-regen.yml"
  push:
    branches: [main]
    paths:
      - "src/DCS-data-2021/timws.csv"
      - "src/DCS-data-2021/_8.csv"
      - "src/DCS-data-2026/regen_widgets.py"
      - "gen_dcs_lemma_summary.py"
      - "dcs_published_figures.json"
      - "dcs_lemma_summary.json"
      - "check_generated_figures.py"
      - ".github/workflows/figures-regen.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: figures-regen-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regen:
    name: Regenerate contract figures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /check_generated_figures.py
            /gen_dcs_lemma_summary.py
            /validate_dcs_lemma_summary.py
            /dcs_published_figures.json
            /dcs_lemma_summary.json
            /src/DCS-data-2026/*.py
            /src/DCS-data-2021/timws.csv
            /src/DCS-data-2021/_8.csv
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Regenerate
        run: |
          python src/DCS-data-2026/regen_widgets.py --figures-only
          python gen_dcs_lemma_summary.py
          python validate_dcs_lemma_summary.py dcs_lemma_summary.json
      - name: Refuse drift (pull request)
        if: github.event_name == 'pull_request'
        run: |
          if ! python check_generated_figures.py; then
            echo "::error::Contract assets lag their sources. Fix: python src/DCS-data-2026/regen_widgets.py --figures-only && python gen_dcs_lemma_summary.py, then commit both JSON files."
            exit 1
          fi
      - name: Commit regenerated assets (main)
        if: github.event_name != 'pull_request'
        run: |
          if python check_generated_figures.py --restore-date-only; then
            echo "assets already current (date-stamp-only changes discarded)"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- dcs_published_figures.json dcs_lemma_summary.json
          git commit -m "chore(figures): regenerate contract assets from sources [H5423]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 10))
          done
          echo "::error::could not land the regenerated assets after 3 attempts"
          exit 1
