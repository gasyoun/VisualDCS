name: CI

# Baseline CI for generic / satellite repos.
# Language-agnostic checks: markdown lint, YAML lint,
# plus opportunistic language-specific lint if package.json/requirements.txt present.
# Markdown link check moved to its own scheduled workflow (link-check.yml, H1743) —
# the Docker-based gaurav-nelson action pulled node:lts-alpine from Docker Hub on every
# run and failed the branch outright on registry timeouts even with continue-on-error,
# since a Docker build failure of the action image isn't caught by that setting.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2
      - name: Lint markdown (warnings only)
        run: markdownlint-cli2 "**/*.md" "#node_modules" || echo "::warning::Markdown lint issues found"

  yaml-lint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
      - run: pip install pyyaml
      - name: Validate all YAML
        run: |
          python -c "
          import sys, glob, yaml
          fail = 0
          for f in glob.glob('**/*.yml', recursive=True) + glob.glob('**/*.yaml', recursive=True):
              if '.git' in f: continue
              try:
                  with open(f, encoding='utf-8') as fh: yaml.safe_load(fh)
              except yaml.YAMLError as e:
                  print(f'::error file={f}::{e}'); fail = 1
          sys.exit(fail)
          "

  # Conditional Python lint
  python-lint:
    name: Python lint (if any .py present)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          if find . -name "*.py" -not -path "./.git/*" | head -1 | grep -q .; then
            echo "has_python=true" >> $GITHUB_OUTPUT
          fi
      - if: steps.check.outputs.has_python == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - if: steps.check.outputs.has_python == 'true'
        run: pip install ruff
      - if: steps.check.outputs.has_python == 'true'
        run: ruff check --select=E9,F63,F7,F82 --output-format=github .

  # Conditional JS lint
  js-lint:
    name: JS lint (if package.json present)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          if [ -f package.json ]; then
            echo "has_pkg=true" >> $GITHUB_OUTPUT
          fi
      - if: steps.check.outputs.has_pkg == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "20"
      - if: steps.check.outputs.has_pkg == 'true'
        run: npm install
      - if: steps.check.outputs.has_pkg == 'true'
        run: npm test --if-present

  # The repo's own render tests existed since H1472 but no workflow ran them — which is
  # how test_nominal_dashboard.js stayed red from H5741 (03-10-2026) until the 24-10-2026
  # bug hunt. Every tests/*.js is headless and needs no DB.
  node-render-tests:
    name: Node render tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Run every tests/*.js
        run: |
          fail=0
          for f in tests/*.js; do
            echo "::group::$f"
            node "$f" || fail=1
            echo "::endgroup::"
          done
          exit $fail

  # DB-free python tests. validate_past_tense_resplit.py needs the 878 MB master and is
  # covered by dcs-validate.yml's DB build instead; test_concordance_sa.py is a pytest
  # module with no __main__ (running it as a script exits 0 without testing anything).
  python-tests:
    name: Python contract tests (DB-free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install jsonschema numpy pytest
      - name: Script tests
        run: |
          for t in test_paradigm_attested test_learner_contracts test_past_nonindicative_formation test_published_figures; do
            echo "::group::$t"
            python "src/DCS-data-2026/$t.py"
            echo "::endgroup::"
          done
      - name: Pytest module (SA concordance, no DB, no network)
        run: python -m pytest src/DCS-data-2026/test_concordance_sa.py -q
